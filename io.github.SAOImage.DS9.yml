app-id: io.github.SAOImage.DS9
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: ds9
modules:
  - name: ds9
    build-options:
      env:
        CFLAGS: -O2  # Avoid issues with GCC introduced with runtime 24.08
        CXXFLAGS: -O2
    buildsystem: simple
    build-commands:
      - TKFLAGS=--disable-libcups ./unix/configure --with-arch=flatpak
      - make tcl9.0/unix/Makefile
      - make -C tcl9.0/unix -j${FLATPAK_BUILDER_N_JOBS} binaries
      - make
      - install -m 755 -D bin/ds9 ${FLATPAK_DEST}/bin/ds9
      - ls -R /app
      - install -Dm644 LICENSE -t ${FLATPAK_DEST}/share/licenses/com.github.SAOImage.DS9
      - install -Dm644 io.github.SAOImage.DS9.desktop ${FLATPAK_DEST}/share/applications/io.github.SAOImage.DS9.desktop
      - install -Dm644 io.github.SAOImage.DS9.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.SAOImage.DS9.png
      - install -Dm644 io.github.SAOImage.DS9.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.SAOImage.DS9.metainfo.xml
    sources:
      - type: git
        url: https://github.com/SAOImageDS9/SAOImageDS9.git
      - type: file
        path: io.github.SAOImage.DS9.desktop
      - type: file
        path: io.github.SAOImage.DS9.png
      - type: file
        path: io.github.SAOImage.DS9.metadata.xml
finish-args:
  - --share=ipc
  - --socket=x11
  - --filesystem=home
  - --share=network
