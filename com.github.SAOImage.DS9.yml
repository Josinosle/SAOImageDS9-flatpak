app-id: com.github.SAOImage.DS9
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: ds9
modules:
  - name: ds9
    build-options:
      env:
        CFLAGS: -O2 -std=gnu17 -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion
    buildsystem: simple
    build-commands:
      - sed -i 's/tclsh/$(TCLSH_PROG)/' ds9/make.include  # See: https://github.com/SAOImageDS9/SAOImageDS9/issues/134
      - ./unix/configure
      - make
      - install -m 755 -D bin/ds9 /app/bin/ds9
      - ls -R /app
      - install -Dm644 com.github.SAOImage.DS9.desktop /app/share/applications/com.github.SAOImage.DS9.desktop
      - install -Dm644 com.github.SAOImage.DS9.png /app/share/icons/hicolor/256x256/apps/com.github.SAOImage.DS9.png
    sources:
      - type: git
        url: https://github.com/SAOImageDS9/SAOImageDS9.git
      - type: file
        path: com.github.SAOImage.DS9.desktop
      - type: file
        path: com.github.SAOImage.DS9.png
finish-args:
  - --share=ipc
  - --socket=x11
  - --share=network
  - --filesystem=home
